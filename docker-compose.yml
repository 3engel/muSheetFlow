services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend  # Python base only, source is mounted for hot reload
    command: uvicorn api:app --reload --host 0.0.0.0 --port 8000
    container_name: muSheetFlow_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
    environment:
      - DATA_DIR=/app/data
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    container_name: muSheetFlow_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules # Prevents local node_modules from overriding container node_modules
    depends_on:
      - backend
    environment:
      - VITE_PROXY_TARGET=http://backend:8000 # Let Vite proxy requests to the backend
    restart: unless-stopped
